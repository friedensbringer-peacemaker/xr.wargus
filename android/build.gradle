// XR-Stratagus Android-Projekt (immersive OpenXR-App). Die nativen Bibliotheken baut scripts/build-native.sh nach
// src/main/jniLibs/arm64-v8a (libmain.so, libSDL2.so, libc++_shared.so); Gradle verpackt nur.
// Zwei Apps aus derselben Engine- und XR-Schicht (Flavors, gleiche libmain.so): xr.wargus2 (Wargus) und
// xr.wargus1 (War1gus). Das Spielpaket wählt libmain.so zur Laufzeit nach der App-ID (native/xr/xr_game.h).

plugins {
    id 'com.android.application' version '8.7.3'
}

// Version zentral in version.properties (versionCode steigt mit jeder weitergegebenen APK)
def versionProps = new Properties()
file('../version.properties').withInputStream { versionProps.load(it) }
def appVersionName = versionProps.getProperty('versionName')
def appVersionCode = versionProps.getProperty('versionCode')
if (!appVersionName || !(appVersionCode ==~ /[1-9][0-9]*/)) {
    throw new GradleException('version.properties: versionName/versionCode ungültig')
}

android {
    namespace 'xr.stratagus'
    compileSdk 34
    // Für das Strippen der vorgebauten .so-Dateien
    ndkVersion '30.0.16248370'

    defaultConfig {
        minSdk 29
        targetSdk 34
        versionCode appVersionCode.toInteger()
        versionName appVersionName
        // Quest: nur arm64 (der Loader-AAR bringt sonst auch andere ABIs mit)
        ndk { abiFilters 'arm64-v8a' }
    }

    // App-ID = Label (xr.<name>, klein, kein Markenname); Label je Flavor in src/<flavor>/res/values/strings.xml
    flavorDimensions = ['game']
    productFlavors {
        stratagus {
            dimension 'game'
            applicationId 'xr.wargus2'
        }
        war1gus {
            dimension 'game'
            applicationId 'xr.wargus1'
        }
    }

    sourceSets {
        main {
            // SDL2-Java-Schicht (SDLActivity & Co.) direkt aus dem festgelegten SDL-Submodul;
            // sie muss exakt zur nativen libSDL2.so passen.
            java.srcDirs += ['../external/SDL/android-project/app/src/main/java']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            // stratagus: unverändert XR-Stratagus-<typ>.apk, war1gus: XR-War1gus-<typ>.apk
            def game = variant.flavorName == 'war1gus' ? 'War1gus' : 'Stratagus'
            outputFileName = "XR-${game}-${variant.buildType.name}.apk"
        }
    }
}

tasks.register('checkNativeLibs') {
    doLast {
        ['libmain.so', 'libSDL2.so', 'libc++_shared.so'].each { lib ->
            if (!file("src/main/jniLibs/arm64-v8a/$lib").exists()) {
                throw new GradleException("$lib fehlt — zuerst scripts/build-native.sh ausführen")
            }
        }
    }
}
preBuild.dependsOn checkNativeLibs

dependencies {
    // Offizieller OpenXR-Loader (Khronos): bringt libopenxr_loader.so und die Manifest-Einträge
    // in die APK. Version wie OPENXR_VERSION in scripts/build-native.sh (dort nur zum Linken).
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.58'
}
